[package]
name = "mesh-rs"
version = "0.1.0"
edition = "2024"
description = "mesh-rs Phase 0 — P2P clipboard hand-off over iroh (binary: clip)"

[[bin]]
name = "clip"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
arboard = { version = "3.6.1", features = ["image-data"] }
blake3 = "1.8.5"
ciborium = "0.2.2"
clap = { version = "4.6.1", features = ["derive"] }
data-encoding = "2.11.0"
directories = "6.0.0"
hex = "0.4.3"
image = "0.25.10"
interprocess = { version = "2.4.2", features = ["tokio"] }
# iroh's API churns across releases; pin it EXACTLY. This code targets the iroh 1.0.2 API
# (EndpointId/EndpointAddr, presets::Minimal, Router/ProtocolHandler, conn.open_bi/accept_bi).
iroh = "=1.0.2"
# LAN auto-discovery: iroh 1.0.2 renamed "discovery" to "address lookup"; the mDNS
# (swarm-discovery) variant lives in this companion crate, pinned to its iroh-1.0 line.
# It scopes discovery by mDNS service name (we fold the room into it) and the ALPN keeps
# the hard room-isolation guarantee at the QUIC handshake.
iroh-mdns-address-lookup = "=0.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
# StreamExt::next() for the mDNS discovery event stream.
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "1.2.1"
# ---- TUI (`clip tui`) --------------------------------------------------------
# Pinned as a consistent set: tui-textarea 0.7 caps ratatui at ^0.29, so the whole
# widget stack rides ratatui 0.29 + its crossterm 0.28 (event-stream = async input).
# ratatui-image 9.0.0 is the release that targets ratatui 0.29 and renders the inline
# image thumbnails (Kitty/iTerm2/Sixel graphics, degrading to Unicode half-blocks).
ratatui = "0.29"
# default-features off => drop the optional libchafa dynamic link; the Unicode half-block
# fallback (built in) is exactly the degradation path we want when no graphics protocol exists.
ratatui-image = { version = "=9.0.0", default-features = false, features = ["crossterm", "image-defaults"] }
tui-textarea = "0.7.0"
crossterm = { version = "0.28", features = ["event-stream"] }

[dev-dependencies]
# PTY driver for the gated `clip tui` end-to-end test (tests/tui_e2e.rs): spawns the
# built binary under a pseudo-terminal, expects the header, sends a quit key, and
# reaps the exit status. Blocking (sync) API — no async runtime needed for the test.
# The test is #[ignore]d (spawns a daemon + needs a real PTY), so it stays out of the
# default `cargo test`; run it with `cargo test --test tui_e2e -- --ignored`.
expectrl = "0.9.0"
# Temp dirs for the sink/session (SPEC §3/§8) unit tests + the TUI e2e's isolated home.
tempfile = "3"
